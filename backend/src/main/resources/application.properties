spring.application.name=local-services-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/local_services}
spring.datasource.username=${DB_USER:local_services}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:local-services-api}
app.security.jwt.audience=${JWT_AUDIENCE:local-services-api}
app.security.jwt.expiration=PT30M
app.security.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
